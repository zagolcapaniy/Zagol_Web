<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የዛጎል ኩባንያ (Zagol Company) | የትምህርት ማዕከል</title>
    <!-- ለሚያምሩ አይኮኖች Font Awesome ማያያዣ -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary: #1e3c72;
            --secondary: #2a5298;
            --accent: #ff6b6b;
            --success: #2ecc71;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --warning: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f3f8;
            color: var(--dark);
        }

        /* 🌟 የራስጌ ማራኪ ዲዛይን (Hero Section) */
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 60px 20px 80px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: -40px auto 40px auto;
            padding: 0 20px;
        }

        /* 👥 1. የተጠቃሚዎች ምዝገባ እና ፕሮፋይል ሳጥን */
        .register-card, .profile-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 40px;
            transition: 0.5s ease-in-out;
        }

        .profile-card {
            display: none; /* መጀመሪያ አይታይም በጃቫስክሪፕት ነው ሚበራው */
            border-left: 8px solid var(--primary);
            background: linear-gradient(to right, #ffffff, #f7f9fc);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 15px;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 10px rgba(30, 60, 114, 0.3);
        }

        .profile-details h3 {
            font-size: 1.6rem;
            color: var(--primary);
        }

        .profile-details p {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .profile-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-box {
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #eef2f5;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .info-box i {
            color: var(--secondary);
            font-size: 1.2rem;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        .register-card h2 {
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--secondary);
        }

        .btn-reg {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-reg:hover {
            background: var(--secondary);
        }

        /* 🚀 2. የወደፊት የትኩረት አቅጣጫዎች (Zagol Focus Areas) */
        .focus-section {
            margin-bottom: 40px;
        }

        .focus-section h2 {
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
        }

        .focus-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .focus-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--warning);
            position: relative;
            overflow: hidden;
        }

        .focus-card i {
            font-size: 2.5rem;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .focus-card h3 {
            margin-bottom: 10px;
            color: var(--dark);
        }

        .badge-coming {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #fff3cd;
            color: #856404;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 📚 3. የመጽሐፍት ማውረጃ ዲዛይን */
        .library-section {
            margin-bottom: 40px;
        }

        .library-section h2 {
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            border-top: 5px solid var(--secondary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .book-info h3 {
            color: var(--dark);
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .book-info .author {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .book-info .tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-download {
            background: var(--success);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-download:hover {
            background: #27ae60;
        }

        /* 🤖 4. የቴሌግราม ቦት ካርድ */
        .bot-link-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 40px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .bot-link-card h2 {
            color: #0088cc;
            margin-bottom: 10px;
        }

        .btn-bot {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-bot:hover {
            background: #006699;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            border-top: 1px solid #e0e0e0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🐚 የዛጎል ኩባንያ (Zagol Company)</h1>
